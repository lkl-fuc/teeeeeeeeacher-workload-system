server:
  port: 8080

spring:
  application:
    name: teacher-workload-backend
  datasource:
    url: jdbc:mysql://localhost:3306/teacher_workload_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: teacher-workload-secret-key-change-me-please-256-bit
  expiration: 86400000
